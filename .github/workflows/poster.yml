name: VaultKey auto-poster

on:
  schedule:
    # Runs every 15 minutes (times are UTC). The script decides what is due
    # in your channel's timezone, so posts go out at the right local time.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write          # needed to save posted.json back to the repo

concurrency:
  group: vaultkey-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python post.py

      - name: Save what was posted
        run: |
          if [[ -n "$(git status --porcelain posted.json)" ]]; then
            git config user.name "vaultkey-bot"
            git config user.email "bot@users.noreply.github.com"
            git add posted.json
            git commit -m "posted update [skip ci]"
            git push
          else
            echo "No changes to posted.json"
          fi
